name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Analyze & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze code
        run: flutter analyze
        
      - name: Run unit tests
        run: flutter test --coverage

  ios_verify:
    name: Verify iOS Simulator Build
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Boot iOS Simulator
        run: |
          # WatchOS companion requires a device ID — boot one for CI
          DEVICE_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            for d in devices:
              if 'iPhone' in d['name'] and d['isAvailable']:
                print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: iOS Simulator Build (Dry run)
        run: |
          export SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          export DEVELOPER_DIR=$(xcode-select -p)
          flutter build ios --simulator --debug --no-codesign -d "$DEVICE_ID"
