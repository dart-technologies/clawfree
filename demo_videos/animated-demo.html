<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clawfree 四裝置 Demo - 自動演示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .devices-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
        }
        .device {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }
        .device:nth-child(1) { animation-delay: 0.2s; }
        .device:nth-child(2) { animation-delay: 0.4s; }
        .device:nth-child(3) { animation-delay: 0.6s; }
        .device:nth-child(4) { animation-delay: 0.8s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .device-title {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }
        .device-screen {
            background: #000;
            border-radius: 8px;
            min-height: 400px;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        
        /* 场景动画 */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: sceneTransition 3s;
        }
        
        @keyframes sceneTransition {
            0%, 10% { opacity: 0; }
            20%, 80% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }
        
        .watch-recording {
            animation-delay: 1s;
        }
        .iphone-receiving {
            animation-delay: 4s;
        }
        .genui-building {
            animation-delay: 7s;
        }
        .sync-complete {
            animation-delay: 10s;
        }
        
        .pulse {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #007aff;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 0.4; }
        }
        
        .message-bubble {
            background: #007aff;
            color: #fff;
            padding: 12px 16px;
            border-radius: 18px;
            margin: 10px 0;
            animation: slideIn 0.5s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .genui-card {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 15px;
            margin: 8px 0;
            animation: cardPop 0.4s;
        }
        
        @keyframes cardPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .sync-icon {
            font-size: 48px;
            animation: rotate 2s linear infinite;
        }
        
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="devices-container">
            <!-- Apple Watch -->
            <div class="device">
                <div class="device-title">⌚ Apple Watch</div>
                <div class="device-screen">
                    <div class="scene watch-recording">
                        <div class="pulse"></div>
                        <p style="margin-top: 20px;">🎙️ Recording...</p>
                        <p style="font-size: 14px; color: #888;">Build a Trip Agent</p>
                    </div>
                </div>
            </div>
            
            <!-- iPhone -->
            <div class="device">
                <div class="device-title">📱 iPhone</div>
                <div class="device-screen">
                    <div class="scene iphone-receiving">
                        <div class="message-bubble">Build a Trip Agent</div>
                        <div class="message-bubble" style="background: #3a3a3c; animation-delay: 0.5s;">
                            Creating your agent...
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- MacBook -->
            <div class="device">
                <div class="device-title">💻 MacBook</div>
                <div class="device-screen">
                    <div class="scene genui-building">
                        <div style="width: 100%; text-align: left;">
                            <h3 style="margin-bottom: 15px;">🤖 Create Agent</h3>
                            <div class="genui-card" style="animation-delay: 0.2s;">
                                ✅ Trip Planner
                            </div>
                            <div class="genui-card" style="animation-delay: 0.4s;">
                                📝 Note Taker
                            </div>
                            <div class="genui-card" style="animation-delay: 0.6s;">
                                🔍 Research Assistant
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- iPad -->
            <div class="device">
                <div class="device-title">📱 iPad</div>
                <div class="device-screen">
                    <div class="scene sync-complete">
                        <div class="sync-icon">🔄</div>
                        <p style="margin-top: 20px;">Syncing...</p>
                        <p style="font-size: 14px; color: #888;">All devices updated</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 自动循环
        setTimeout(() => {
            location.reload();
        }, 15000);
    </script>
</body>
</html>
