<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch UI Variants</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'SF Pro', 'Helvetica Neue', sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { font-size: 24px; font-weight: 300; margin-bottom: 8px; color: #e0e0e0; }

/* Controls */
.controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
.controls button { padding: 8px 16px; border: 1px solid #444; background: #2a2a3e; color: #ccc; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all .2s; }
.controls button.active { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
.controls button:hover { background: #3a3a5e; }
.controls button.active:hover { background: #7c6cf7; }

.state-controls { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.state-controls button { padding: 6px 12px; border: 1px solid #555; background: transparent; color: #aaa; border-radius: 14px; cursor: pointer; font-size: 12px; transition: all .2s; }
.state-controls button.active { background: #00b894; border-color: #00b894; color: #fff; }

/* Watch Frame */
.watch-container { display: flex; justify-content: center; }
.watch-frame { width: 368px; height: 448px; background: #000; border-radius: 80px; overflow: hidden; position: relative; box-shadow: 0 0 0 4px #333, 0 0 40px rgba(108,92,231,.3); }

/* Label */
.variant-label { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,.35); z-index: 100; letter-spacing: 1px; pointer-events: none; }

/* Shared inner styles */
.watch-screen { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }

/* Animations */
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }
@keyframes wave { 0%,100% { height: 12px; } 50% { height: 32px; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes breathe { 0%,100% { box-shadow: 0 0 20px rgba(108,92,231,.3); } 50% { box-shadow: 0 0 40px rgba(108,92,231,.6); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dotPulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

/* Waveform bars */
.wave-bars { display: flex; gap: 4px; align-items: center; justify-content: center; height: 40px; }
.wave-bars .bar { width: 4px; background: #6c5ce7; border-radius: 2px; animation: wave .6s ease-in-out infinite; }
.wave-bars .bar:nth-child(1) { animation-delay: 0s; }
.wave-bars .bar:nth-child(2) { animation-delay: .1s; }
.wave-bars .bar:nth-child(3) { animation-delay: .2s; }
.wave-bars .bar:nth-child(4) { animation-delay: .3s; }
.wave-bars .bar:nth-child(5) { animation-delay: .4s; }
.wave-bars .bar:nth-child(6) { animation-delay: .3s; }
.wave-bars .bar:nth-child(7) { animation-delay: .2s; }

/* Chat bubbles */
.chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; animation: fadeIn .3s ease; }
.bubble.user { align-self: flex-end; background: #6c5ce7; color: #fff; border-bottom-right-radius: 4px; }
.bubble.ai { align-self: flex-start; background: #2a2a3e; color: #e0e0e0; border-bottom-left-radius: 4px; }
.bubble.success { align-self: flex-start; background: #1e3a2f; color: #00b894; border-bottom-left-radius: 4px; }

/* Recognizing text */
.recog-text { font-size: 18px; color: #fff; text-align: center; padding: 0 24px; line-height: 1.5; }

/* Common buttons */
.btn-circle { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: all .2s; }
.btn-pill { padding: 12px 32px; border-radius: 28px; border: none; cursor: pointer; font-size: 16px; font-weight: 500; transition: all .2s; }

/* ===== VARIANT 1 ===== */
.v1-idle { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
.v1-idle .tap-btn { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, #6c5ce7, #a29bfe); border: none; color: #fff; font-size: 16px; font-weight: 500; cursor: pointer; animation: breathe 3s infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.v1-idle .tap-btn .mic-icon { font-size: 32px; }

.v1-listening { display: flex; flex-direction: column; align-items: center; height: 100%; }
.v1-listening .close-top { position: absolute; top: 24px; right: 24px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.1); border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.v1-listening .wave-area { flex: 1; display: flex; align-items: center; justify-content: center; }
.v1-listening .status-text { color: rgba(255,255,255,.5); font-size: 13px; margin-bottom: 40px; }

.v1-recog { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; }
.v1-recog .dots { display: flex; gap: 6px; }
.v1-recog .dots span { width: 6px; height: 6px; border-radius: 50%; background: #6c5ce7; animation: dotPulse 1s infinite; }
.v1-recog .dots span:nth-child(2) { animation-delay: .2s; }
.v1-recog .dots span:nth-child(3) { animation-delay: .4s; }

.v1-convo { display: flex; flex-direction: column; height: 100%; }
.v1-convo .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px; }
.v1-convo .close-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.1); border: none; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.v1-convo .bottom-bar { display: flex; justify-content: center; padding: 12px; gap: 16px; }
.v1-convo .bottom-bar .btn-circle { width: 44px; height: 44px; background: rgba(255,255,255,.1); color: #fff; }

/* ===== VARIANT 2 ===== */
.v2-idle { display: flex; flex-direction: column; height: 100%; justify-content: space-between; align-items: center; padding: 60px 24px 32px; }
.v2-idle .greeting { font-size: 22px; font-weight: 300; color: #e0e0e0; text-align: center; }
.v2-idle .sub { font-size: 13px; color: rgba(255,255,255,.4); margin-top: 8px; }
.v2-idle .bottom-btn { width: 100%; padding: 14px; border-radius: 24px; background: #6c5ce7; border: none; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

.v2-listening { display: flex; flex-direction: column; height: 100%; justify-content: space-between; padding: 40px 24px 32px; align-items: center; }
.v2-listening .wave-section { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
.v2-listening .cancel-btn { width: 100%; padding: 14px; border-radius: 24px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #ff6b6b; font-size: 15px; cursor: pointer; }

.v2-recog { display: flex; flex-direction: column; height: 100%; justify-content: space-between; padding: 40px 24px 32px; align-items: center; }
.v2-recog .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }

.v2-convo { display: flex; flex-direction: column; height: 100%; }
.v2-convo .bottom-bar { display: flex; padding: 10px 24px; gap: 12px; background: rgba(0,0,0,.5); }
.v2-convo .bottom-bar button { flex: 1; padding: 10px; border-radius: 20px; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.v2-convo .mic-btn { background: #6c5ce7; color: #fff; }
.v2-convo .pause-btn { background: rgba(255,255,255,.1); color: #ccc; }

/* ===== VARIANT 3 ===== */
.v3-idle { display: flex; flex-direction: column; height: 100%; justify-content: center; align-items: center; padding: 24px; }
.v3-idle .greeting { font-size: 20px; font-weight: 300; color: #e0e0e0; }
.v3-idle .sub { font-size: 12px; color: rgba(255,255,255,.35); margin-top: 6px; }
.v3-fab { position: absolute; bottom: 36px; right: 36px; width: 56px; height: 56px; border-radius: 50%; background: #6c5ce7; border: none; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(108,92,231,.5); display: flex; align-items: center; justify-content: center; z-index: 10; transition: all .2s; }
.v3-fab.cancel { background: #ff6b6b; }
.v3-fab.pause { background: #fdcb6e; color: #333; }

.v3-listening { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; gap: 12px; }
.v3-recog { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; gap: 16px; }
.v3-convo { display: flex; flex-direction: column; height: 100%; }

/* ===== VARIANT 4 ===== */
.v4-idle { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; cursor: pointer; }
.v4-idle .tap-area { text-align: center; }
.v4-idle .big-mic { font-size: 48px; margin-bottom: 16px; opacity: .6; }
.v4-idle .hint { font-size: 16px; color: rgba(255,255,255,.7); font-weight: 300; }
.v4-idle .sub-hint { font-size: 11px; color: rgba(255,255,255,.25); margin-top: 8px; }

.v4-listening { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; gap: 16px; }
.v4-listening .swipe-hint { font-size: 12px; color: rgba(255,255,255,.35); position: absolute; bottom: 40px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.v4-listening .swipe-hint .arrow { font-size: 18px; animation: slideUp 1.5s infinite; }

.v4-recog { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; gap: 16px; }

.v4-convo { display: flex; flex-direction: column; height: 100%; }
.v4-convo .gesture-bar { padding: 8px; text-align: center; font-size: 10px; color: rgba(255,255,255,.25); background: rgba(255,255,255,.03); letter-spacing: .5px; }

/* ===== VARIANT 5 ===== */
.v5-idle { display: flex; flex-direction: column; height: 100%; padding: 40px 24px 32px; justify-content: space-between; align-items: center; }
.v5-idle .start-btn { width: 100%; padding: 16px; border-radius: 24px; background: #6c5ce7; border: none; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; letter-spacing: .5px; }
.v5-idle .settings { display: flex; gap: 12px; }
.v5-idle .settings button { padding: 8px 16px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.5); font-size: 12px; cursor: pointer; }

.v5-listening { display: flex; flex-direction: column; height: 100%; align-items: center; }
.v5-listening .wave-top { padding: 24px 24px 0; width: 100%; }
.v5-listening .center-close { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.v5-listening .status { position: absolute; bottom: 40px; font-size: 13px; color: rgba(255,255,255,.4); }

.v5-recog { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; gap: 16px; }

.v5-convo { display: flex; flex-direction: column; height: 100%; }
.v5-convo .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(108,92,231,.15); }
.v5-convo .status-bar .mic-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a29bfe; }
.v5-convo .status-bar .close-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.1); border: none; color: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* Complete state shared */
.complete-icon { font-size: 40px; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>Watch UI Variants</h1>

<div class="controls" id="variantControls"></div>
<div class="state-controls" id="stateControls"></div>

<div class="watch-container">
  <div class="watch-frame">
    <div class="variant-label" id="variantLabel"></div>
    <div class="watch-screen" id="screen"></div>
  </div>
</div>

<script>
const variants = [
  { id: 1, name: 'V1: Center Button' },
  { id: 2, name: 'V2: Bottom Fixed' },
  { id: 3, name: 'V3: Floating FAB' },
  { id: 4, name: 'V4: Gesture First' },
  { id: 5, name: 'V5: Layered Control' },
];
const states = [
  { id: 'A', name: 'Idle' },
  { id: 'B', name: 'Listening' },
  { id: 'C', name: 'Recognizing' },
  { id: 'D', name: 'Conversation' },
  { id: 'E', name: 'Complete' },
];

let currentVariant = 1;
let currentState = 'A';

const waveBars = `<div class="wave-bars">${[...Array(7)].map(()=>'<div class="bar"></div>').join('')}</div>`;
const dots = `<div class="dots"><span></span><span></span><span></span></div>`;
const recogText = `<div class="recog-text">Plan a 3-day foodie trip to Tokyo</div>`;

const userMsg = `Plan a 3-day foodie trip to Tokyo`;
const aiMsg = `Here's your 3-day Tokyo foodie itinerary! I've organized it by neighborhood for easy navigation.`;
const complete1 = `✅ Successfully created your Tokyo foodie itinerary`;
const complete2 = `✅ Successfully saved to your trips`;

function chatBubbles(extra='') {
  return `<div class="chat"><div class="bubble user">${userMsg}</div><div class="bubble ai">${aiMsg}</div>${extra}</div>`;
}
function completeBubbles() {
  return `<div class="chat"><div class="bubble user">${userMsg}</div><div class="bubble ai">${aiMsg}</div><div class="bubble success">${complete1}</div><div class="bubble success">${complete2}</div></div>`;
}

function render() {
  const v = currentVariant, s = currentState;
  const label = `${v}-${s}`;
  document.getElementById('variantLabel').textContent = label;

  const scr = document.getElementById('screen');
  let html = '';

  // V1
  if (v === 1) {
    if (s === 'A') html = `<div class="v1-idle"><div class="tap-btn"><span class="mic-icon">🎤</span>Tap to speak</div></div>`;
    else if (s === 'B') html = `<div class="v1-listening"><button class="close-top">✕</button><div class="wave-area">${waveBars}</div><div class="status-text">Listening...</div></div>`;
    else if (s === 'C') html = `<div class="v1-recog">${recogText}${dots}</div>`;
    else if (s === 'D') html = `<div class="v1-convo"><div class="top-bar"><button class="close-btn">✕</button><span style="font-size:12px;color:rgba(255,255,255,.4)">Mai</span><span></span></div>${chatBubbles()}<div class="bottom-bar"><button class="btn-circle">🎤</button><button class="btn-circle">⏸</button></div></div>`;
    else html = `<div class="v1-convo"><div class="top-bar"><button class="close-btn">✕</button><span style="font-size:12px;color:rgba(255,255,255,.4)">Mai</span><span></span></div>${completeBubbles()}<div class="bottom-bar"><button class="btn-circle">🎤</button></div></div>`;
  }
  // V2
  else if (v === 2) {
    if (s === 'A') html = `<div class="v2-idle"><div><div class="greeting">Hi, Roy 👋</div><div class="sub">What can I help you with?</div></div><button class="bottom-btn">🎤 Tap to speak</button></div>`;
    else if (s === 'B') html = `<div class="v2-listening"><div class="wave-section">${waveBars}<div style="font-size:13px;color:rgba(255,255,255,.4)">Listening...</div></div><button class="cancel-btn">Cancel</button></div>`;
    else if (s === 'C') html = `<div class="v2-recog"><div class="content">${recogText}${dots}</div><button class="cancel-btn" style="width:100%;padding:14px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.3);font-size:14px;cursor:pointer">Processing...</button></div>`;
    else if (s === 'D') html = `<div class="v2-convo">${chatBubbles()}<div class="bottom-bar"><button class="mic-btn">🎤 Mic</button><button class="pause-btn">⏸ Pause</button></div></div>`;
    else html = `<div class="v2-convo">${completeBubbles()}<div class="bottom-bar"><button class="mic-btn">🎤 New</button></div></div>`;
  }
  // V3
  else if (v === 3) {
    if (s === 'A') html = `<div class="v3-idle"><div><div class="greeting">Ready to assist</div><div class="sub">Tap the mic to start</div></div></div><button class="v3-fab">🎤</button>`;
    else if (s === 'B') html = `<div class="v3-listening">${waveBars}<div style="font-size:13px;color:rgba(255,255,255,.4)">Listening...</div></div><button class="v3-fab cancel">✕</button>`;
    else if (s === 'C') html = `<div class="v3-recog">${recogText}${dots}</div><button class="v3-fab" style="background:rgba(255,255,255,.1);font-size:16px">⏳</button>`;
    else if (s === 'D') html = `<div class="v3-convo">${chatBubbles()}</div><button class="v3-fab pause">⏸</button>`;
    else html = `<div class="v3-convo">${completeBubbles()}</div><button class="v3-fab">🎤</button>`;
  }
  // V4
  else if (v === 4) {
    if (s === 'A') html = `<div class="v4-idle"><div class="tap-area"><div class="big-mic">🎤</div><div class="hint">Tap anywhere to speak</div><div class="sub-hint">Your AI assistant is ready</div></div></div>`;
    else if (s === 'B') html = `<div class="v4-listening">${waveBars}<div style="font-size:14px;color:rgba(255,255,255,.5)">Listening...</div><div class="swipe-hint"><span class="arrow">↑</span><span>Swipe up to cancel</span></div></div>`;
    else if (s === 'C') html = `<div class="v4-recog">${recogText}${dots}</div>`;
    else if (s === 'D') html = `<div class="v4-convo"><div class="gesture-bar">Double-tap: pause · Long-press: exit</div>${chatBubbles()}</div>`;
    else html = `<div class="v4-convo"><div class="gesture-bar">Tap anywhere to start new</div>${completeBubbles()}</div>`;
  }
  // V5
  else if (v === 5) {
    if (s === 'A') html = `<div class="v5-idle"><div style="text-align:center"><div style="font-size:28px;margin-bottom:8px">🎯</div><div style="font-size:18px;font-weight:300;color:#e0e0e0">Mai Assistant</div></div><button class="start-btn">▶ Start</button><div class="settings"><button>⚙️ Settings</button><button>📋 History</button></div></div>`;
    else if (s === 'B') html = `<div class="v5-listening"><div class="wave-top">${waveBars}</div><button class="center-close">✕</button><div class="status">Listening...</div></div>`;
    else if (s === 'C') html = `<div class="v5-recog"><div style="width:100%;padding:16px 24px">${waveBars}</div>${recogText}${dots}</div>`;
    else if (s === 'D') html = `<div class="v5-convo"><div class="status-bar"><div class="mic-status"><span>🎤</span> Active</div><button class="close-btn">✕</button></div>${chatBubbles()}</div>`;
    else html = `<div class="v5-convo"><div class="status-bar"><div class="mic-status"><span>✅</span> Done</div><button class="close-btn">✕</button></div>${completeBubbles()}</div>`;
  }

  scr.innerHTML = html;
}

// Build controls
const vc = document.getElementById('variantControls');
variants.forEach(v => {
  const b = document.createElement('button');
  b.textContent = v.name;
  b.onclick = () => { currentVariant = v.id; updateUI(); };
  vc.appendChild(b);
});

const sc = document.getElementById('stateControls');
states.forEach(s => {
  const b = document.createElement('button');
  b.textContent = `${s.id}: ${s.name}`;
  b.onclick = () => { currentState = s.id; updateUI(); };
  sc.appendChild(b);
});

function updateUI() {
  document.querySelectorAll('#variantControls button').forEach((b,i) => b.classList.toggle('active', variants[i].id === currentVariant));
  document.querySelectorAll('#stateControls button').forEach((b,i) => b.classList.toggle('active', states[i].id === currentState));
  render();
}

updateUI();
</script>
</body>
</html>
