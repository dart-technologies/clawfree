name: clawfree
description: "Hands-free AI agent creation powered by Opus 4.6 and Flutter genUI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # genUI v0.9 (local path during dev, switch to git ref for submission)
  genui:
    path: ../genui/packages/genui

  # AI client
  dartantic_ai: ^1.3.0
  http: ^1.3.0

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6

  # Voice recording
  record: ^5.1.0
  path_provider: ^2.1.0

  # HTTP (for OpenClaw service)
  dio: ^5.4.0

  # Utilities
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#1A1A1A"
  color_dark: "#1A1A1A"
  image: assets/icon.png
  android_12:
    color: "#1A1A1A"
    color_dark: "#1A1A1A"
    image: assets/icon.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
