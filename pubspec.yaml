name: clawfree
description: "Hands-free AI agent orchestrator powered by Flutter genUI"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.35.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # genUI v0.9 — git ref for CI/Docker; local override via pubspec_overrides.yaml
  genui:
    git:
      url: https://github.com/flutter/genui.git
      ref: feature/v0.9-migration
      path: packages/genui

  # AI client
  dartantic_ai: ^3.0.0
  http: ^1.3.0

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Charts
  fl_chart: ^1.1.1

  # QR code rendering & scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4

  # Deep linking
  app_links: ^7.0.0

  # Persistence
  shared_preferences: ^2.5.0

  # Audio earcons
  audioplayers: ^6.1.0

  # Video generation & playback
  ffmpeg_kit_flutter_new:
    git:
      url: https://github.com/dart-technologies/ffmpeg_kit_flutter.git
      ref: arm64-simulator-support
  video_player: ^2.10.0
  path_provider: ^2.1.5

  # Markdown rendering (transitive via genUI, needed by Text override)
  flutter_markdown_plus: ^1.0.7

  # Schema builder (used by catalog.dart for custom component schemas)
  json_schema_builder: ^0.1.3

  # Utilities
  logging: ^1.3.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  material_symbols_icons: ^4.2906.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
  shaders:
    - shaders/voice_blob.frag
