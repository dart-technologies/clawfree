name: clawfree
description: "Hands-free AI agent creation powered by Opus 4.6 and Flutter genUI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.35.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # genUI v0.9 (local path during dev, switch to git ref for submission)
  genui:
    path: ../genui/packages/genui

  # AI client
  dartantic_ai: ^3.0.0
  http: ^1.3.0

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Utilities
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
