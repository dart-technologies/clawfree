name: clawfree
description: "Hands-free AI agent creation powered by Opus 4.6 and Flutter genUI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.35.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # genUI v0.9 — git ref for CI/Docker; local override via pubspec_overrides.yaml
  genui:
    git:
      url: https://github.com/flutter/genui.git
      ref: 172d13703f88f0242a464c4eedeaaeb562b9f82b
      path: packages/genui

  # AI client
  dartantic_ai: ^3.0.0
  http: ^1.3.0

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Charts
  fl_chart: ^0.69.0

  # QR code rendering
  qr_flutter: ^4.1.0

  # Persistence
  shared_preferences: ^2.5.0

  # Audio earcons
  audioplayers: ^6.1.0

  # Schema builder (used by catalog.dart for custom component schemas)
  json_schema_builder: ^0.1.3

  # Utilities
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  shaders:
    - shaders/voice_blob.frag
